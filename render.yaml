services:
  # ── Backend (FastAPI) ──────────────────────────────────────────────────────
  - type: web
    name: talentiq-backend
    runtime: python
    rootDir: ai-recruitment-Backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_NAME
        value: AI Recruitment Intelligence Platform
      - key: DEBUG
        value: false
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: talentiq-db
          property: connectionString
      - key: AI_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: FAISS_INDEX_PATH
        value: ./vector_store/faiss_index
      - key: EMBEDDING_DIMENSION
        value: 1536
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 60
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: 7
      - key: UPLOAD_DIR
        value: ./uploads
      - key: MAX_FILE_SIZE_MB
        value: 10
      - key: ALLOWED_ORIGINS
        value: https://talentiq-frontend.onrender.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_CLIENT_ID
        sync: false
      - key: MICROSOFT_CLIENT_SECRET
        sync: false
      - key: BACKEND_URL
        value: https://talentiq-backend.onrender.com
      - key: FRONTEND_URL
        value: https://talentiq-frontend.onrender.com
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: FROM_NAME
        value: TalentIQ
      - key: REMINDER_CRON_SECRET
        generateValue: true
      - key: INTERVIEW_OS_URL
        value: https://talentiq-interview.onrender.com
      - key: TALENTIQ_API_KEY
        generateValue: true

  # ── Interview OS (Node.js) ────────────────────────────────────────────────
  - type: web
    name: talentiq-interview
    runtime: node
    rootDir: ai-recruitment-Interview
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: TALENTIQ_API_KEY
        fromService:
          name: talentiq-backend
          type: env
          property: TALENTIQ_API_KEY
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://talentiq-frontend.onrender.com,https://talentiq-backend.onrender.com
      - key: BASE_URL
        value: https://talentiq-interview.onrender.com

  # ── Frontend (React → Static Site) ────────────────────────────────────────
  - type: web
    name: talentiq-frontend
    runtime: static
    rootDir: ai-recruitment-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://talentiq-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# ── Postgres Database ──────────────────────────────────────────────────────
databases:
  - name: talentiq-db
    databaseName: ai_recruitment
    plan: free
