version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: talentiq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_recruitment
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./ai-recruitment-Backend
      dockerfile: Dockerfile
    container_name: talentiq-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./ai-recruitment-Backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:password@postgres:5432/ai_recruitment
    volumes:
      - ./ai-recruitment-Backend/uploads:/app/uploads
      - ./ai-recruitment-Backend/vector_store:/app/vector_store
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./ai-recruitment-frontend
      dockerfile: Dockerfile
    container_name: talentiq-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
